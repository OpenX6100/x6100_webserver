% rebase('base.html', title='Remote')

<style>
  :root {
      --line-color: #333;
      --bg-color: #fff;
      --btn-radius: 4px;
      --std-btn-width: 5em;
      --std-btn-height: 35px;
  }

    /* This view is designed as a fixed-size panel (1000px).
     base.html uses a global CSS that constrains <main> width; escape it locally. */
    .remote-page {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem;
      box-sizing: border-box;
      overflow-x: auto;
    }

  .panel-frame {
      width: min(1000px, 100%);
      height: 520px;
      background: var(--bg-color);
      border: 2px solid var(--line-color);
      border-radius: 10px;
      position: relative;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: 200px 1fr 220px;
      gap: 15px;
      user-select: none;
      box-sizing: border-box;
        margin: 0 auto;
  }

  .btn {
      border: 2px solid var(--line-color);
      border-radius: var(--btn-radius);
      background: white;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--line-color);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.05);
      font-size: 13px;
  }
  .btn:active { background: #eee; transform: translate(1px, 1px); }

  .std-btn { width: var(--std-btn-width); height: var(--std-btn-height); padding: 0 2px; }

  .left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
  }

  .ptt-btn { width: 60px; height: 50px; border-radius: 8px; font-size: 18px; margin-bottom: 5px; }

  .knob-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
  .knob-outer { width: 100%; height: 100%; border: 2px solid var(--line-color); border-radius: 50%; position: absolute; }
  .knob-inner {
      border: 2px solid var(--line-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      background: #fff;
      z-index: 2;
      cursor: pointer;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.05);
      width: 30%;
      height: 30%;
      box-sizing: border-box;
  }
  .knob-inner:active { background: #eee; transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.05); }

  .knob-side-btn {
      position: absolute;
      width: 32px; height: 20px;
      border: 2px solid var(--line-color);
      background: #fff;
      border-radius: 4px;
      font-size: 10px;
      color: #333;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      z-index: 3;
      box-shadow: 1px 1px 0 rgba(0,0,0,0.1);
      box-sizing: border-box;
  }
  .knob-side-btn:active { transform: translate(1px, 1px); box-shadow: none; background: #f4f4f4; }
  .ks-top { top: 8px; }
  .ks-bot { bottom: 8px; }

  .power-pos { margin-bottom: 10px; }

  .keypad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 10px;
      margin: 10px 0;
      justify-items: center;
  }

  .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
  }

  .screen-frame {
      width: 100%;
      aspect-ratio: 800 / 480;
      border: 3px double var(--line-color);
      border-radius: 6px;
      padding: 5px;
      box-sizing: border-box;
      position: relative;
  }
  .lcd-content {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line-color);
      padding: 5px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #111;
  }
  .remote-screen-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
  }
  .screen-status {
      position: absolute;
      right: 8px;
      bottom: 6px;
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.45);
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
      pointer-events: none;
  }

  .f-keys-row {
      display: flex;
      gap: 10px;
      margin-top: 5px;
      width: 100%;
      justify-content: center;
  }

  .right-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
  }

  .refresh-options {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: var(--std-btn-width);
      margin: 4px 0;
  }
  .refresh-option-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: var(--line-color);
      width: 100%;
  }
  .refresh-option-row label { cursor: pointer; white-space: nowrap; }
  .refresh-option-row input[type="checkbox"] { cursor: pointer; }
  .refresh-interval-select {
      min-width: 0;
      flex: 1;
      height: 24px;
      font-size: 11px;
      padding: 0 4px;
      cursor: pointer;
  }

  .big-knob-container { width: 180px; height: 180px; position: relative; }
  .big-knob-outer {
      width: 100%; height: 100%;
      border: 2px solid var(--line-color);
      border-radius: 50%;
      position: relative;
      box-sizing: border-box;
  }
</style>

<section class="remote-page">
  <div class="panel-frame">

      <div class="left-col">
          <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
              <div class="btn ptt-btn" data-key="PTT">PTT</div>

              <div class="knob-wrapper" style="width:100px; height:100px;">
                  <div class="knob-outer"></div>
                  <div class="knob-inner" data-knob-press="VOL">VOL</div>
                  <div class="knob-side-btn ks-top" data-knob="VOL" data-delta="1">+1</div>
                  <div class="knob-side-btn ks-bot" data-knob="VOL" data-delta="-1">-1</div>
              </div>
          </div>

          <div class="btn std-btn power-pos" data-key="POWER">POWER</div>

          <div class="keypad-grid">
              <div class="btn std-btn" data-key="GEN">GEN</div>
              <div class="btn std-btn" data-key="APP">APP</div>

              <div class="btn std-btn" data-key="KEY">KEY</div>
              <div class="btn std-btn" data-key="MSG">MSG</div>

              <div class="btn std-btn" data-key="DFN">DNF</div>
              <div class="btn std-btn" data-key="DFL">DFL</div>
          </div>

          <div class="knob-wrapper" style="width:100px; height:100px;">
              <div class="knob-outer"></div>
              <div class="knob-inner" data-knob-press="MFK">MFK</div>
              <div class="knob-side-btn ks-top" data-knob="MFK" data-delta="1">+1</div>
              <div class="knob-side-btn ks-bot" data-knob="MFK" data-delta="-1">-1</div>
          </div>
      </div>

      <div class="center-col">
          <div style="display:flex; gap: 30px; margin-bottom: 8px; width: 100%; justify-content: center;">
              <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
                  <div style="display:flex; gap:10px;">
                      <div class="btn std-btn" data-key="BAND_DOWN">BAND-</div>
                      <div class="btn std-btn" data-key="BAND_UP">BAND+</div>
                  </div>
                  <div style="display:flex; gap:10px;">
                      <div class="btn std-btn" data-key="MODE_AM">AM/FM</div>
                      <div class="btn std-btn" data-key="MODE_CW">CW</div>
                      <div class="btn std-btn" data-key="MODE_SSB">SSB</div>
                  </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
                  <div style="display:flex; gap:10px;">
                      <div class="btn std-btn" data-key="AB">A/B</div>
                      <div class="btn std-btn" data-key="PRE">PRE</div>
                      <div class="btn std-btn" data-key="ATU">ATU</div>
                  </div>
                  <div style="display:flex; gap:10px;">
                      <div class="btn std-btn" data-key="VM">V/M</div>
                      <div class="btn std-btn" data-key="AGC">AGC</div>
                      <div class="btn std-btn" data-key="FST">FST</div>
                  </div>
              </div>
          </div>

          <div class="screen-frame">
              <div class="lcd-content">
                  <img id="remote-screen" class="remote-screen-img" alt="Remote screen" src="" />
                  <div id="screen-status" class="screen-status" style="display:none;"></div>
              </div>
          </div>

          <div class="f-keys-row">
              <div class="btn std-btn" data-key="F1">F1</div>
              <div class="btn std-btn" data-key="F2">F2</div>
              <div class="btn std-btn" data-key="F3">F3</div>
              <div class="btn std-btn" data-key="F4">F4</div>
              <div class="btn std-btn" data-key="F5">F5</div>
          </div>
      </div>

      <div class="right-col">
          <div class="btn std-btn" id="refresh-screen">REFRESH</div>
          <div class="refresh-options">
              <label class="refresh-option-row">
                  <input type="checkbox" id="refresh-on-button" />
                  <span>After button</span>
              </label>
              <div class="refresh-option-row">
                  <label for="auto-refresh-interval">Interval:</label>
                  <select id="auto-refresh-interval" class="btn refresh-interval-select">
                      <option value="none">None</option>
                      <option value="1">1s</option>
                      <option value="5">5s</option>
                      <option value="10">10s</option>
                      <option value="20">20s</option>
                      <option value="30">30s</option>
                      <option value="60">1min</option>
                  </select>
              </div>
          </div>
          <div class="btn std-btn" data-key="LOCK">LOCK</div>

          <div class="big-knob-container">
              <div class="big-knob-outer" style="display:flex; flex-direction:column; justify-content:center; align-items:center;">
                  <div style="font-weight:bold; margin-bottom:10px; font-size:14px;">VFO</div>
                  <div style="display:flex; gap:4px;">
                      <div class="btn" style="width:32px; height:32px; padding:0; font-size:10px;" data-knob="VFO" data-delta="-10">-10</div>
                      <div class="btn" style="width:32px; height:32px; padding:0; font-size:10px;" data-knob="VFO" data-delta="-1">-1</div>
                      <div class="btn" style="width:32px; height:32px; padding:0; font-size:10px;" data-knob="VFO" data-delta="1">+1</div>
                      <div class="btn" style="width:32px; height:32px; padding:0; font-size:10px;" data-knob="VFO" data-delta="10">+10</div>
                  </div>
              </div>
          </div>
      </div>

  </div>
</section>

<script>
  const screenEl = document.getElementById('remote-screen');
  const screenStatusEl = document.getElementById('screen-status');

  function setStatus(msg) {
    if (!msg) {
      screenStatusEl.style.display = 'none';
      screenStatusEl.textContent = '';
      return;
    }
    screenStatusEl.style.display = '';
    screenStatusEl.textContent = msg;
  }

  let refreshInProgress = false;
  let refreshPollTimer = null;
  let screenObjectUrl = null;
  const REFRESH_POLL_MS = 300;
  const REFRESH_TIMEOUT_MS = 6000;

  function clearPollTimer() {
    if (refreshPollTimer !== null) {
      clearTimeout(refreshPollTimer);
      refreshPollTimer = null;
    }
  }

  function showScreenBlob(blob) {
    if (screenObjectUrl) {
      URL.revokeObjectURL(screenObjectUrl);
      screenObjectUrl = null;
    }
    screenObjectUrl = URL.createObjectURL(blob);
    screenEl.src = screenObjectUrl;
    setStatus('');
  }

  function finishRefresh(ok, msg) {
    clearPollTimer();
    refreshInProgress = false;
    if (!ok) setStatus(msg || 'Not ready, click refresh again');
  }

  async function pollScreen(token, deadline) {
    if (Date.now() >= deadline) {
      finishRefresh(false, 'Not ready, click refresh again');
      return;
    }
    try {
      const response = await fetch(`/api/remote_screen?time=${encodeURIComponent(token)}`);
      if (response.status === 200) {
        showScreenBlob(await response.blob());
        finishRefresh(true);
        return;
      }
      if (response.status === 202) {
        const data = await response.json();
        const nextToken = (data && data.time != null) ? data.time : token;
        refreshPollTimer = setTimeout(() => pollScreen(nextToken, deadline), REFRESH_POLL_MS);
        return;
      }
      finishRefresh(false, 'Failed to load screen');
    } catch (e) {
      finishRefresh(false, 'Failed to load screen');
    }
  }

  async function refreshScreen() {
    if (refreshInProgress) return;
    refreshInProgress = true;
    clearPollTimer();
    setStatus('Refreshing…');
    try {
      const response = await fetch('/api/remote_screen');
      if (response.status !== 202) {
        finishRefresh(false, 'Failed to request screen');
        return;
      }
      const data = await response.json();
      if (!data || data.time == null) {
        finishRefresh(false, 'Failed to request screen');
        return;
      }
      refreshPollTimer = setTimeout(
        () => pollScreen(data.time, Date.now() + REFRESH_TIMEOUT_MS),
        REFRESH_POLL_MS
      );
    } catch (e) {
      finishRefresh(false, 'Failed to request screen');
    }
  }

  document.getElementById('refresh-screen').addEventListener('click', refreshScreen);

  let autoRefreshIntervalId = null;

  function applyInterval() {
    const sel = document.getElementById('auto-refresh-interval');
    const value = sel.value;
    if (autoRefreshIntervalId !== null) {
      clearInterval(autoRefreshIntervalId);
      autoRefreshIntervalId = null;
    }
    if (value === 'none') return;
    const ms = parseInt(value, 10) * 1000;
    if (ms > 0) {
      autoRefreshIntervalId = setInterval(refreshScreen, ms);
    }
  }

  document.getElementById('auto-refresh-interval').addEventListener('change', applyInterval);

  async function sendCommand(payload) {
    const refreshOnButton = document.getElementById('refresh-on-button').checked;
    try {
      await fetch('/api/remote_input', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (refreshOnButton) {
        setTimeout(refreshScreen, 400);
      }
    } catch (e) {
      console.error(e);
    }
  }

  function attachKeyBehavior(btn, keyName) {
    let longTimer = null;
    let longFired = false;
    let pressed = false;
    let activePointerId = null;

    const isRealPress = (e) => {
      if (!e || e.isTrusted === false) return false;
      if (e.pointerType === 'mouse') return (e.buttons & 1) === 1;
      if (e.pointerType === 'touch') return true;
      return false;
    };

    const clearLong = () => {
      if (longTimer) {
        clearTimeout(longTimer);
        longTimer = null;
      }
    };

    const press = (e) => {
      if (!isRealPress(e)) return;
      if (pressed) return;
      pressed = true;
      activePointerId = e.pointerId;
      try { btn.setPointerCapture(activePointerId); } catch (_) {}

      longFired = false;
      sendCommand({ type: 'key', name: keyName, action: 'press' });
      clearLong();
      longTimer = setTimeout(() => {
        if (!pressed) return;
        longFired = true;
        sendCommand({ type: 'key', name: keyName, action: 'long' });
      }, 1000);
    };

    const release = (e) => {
      if (!e || e.isTrusted === false) return;
      if (!pressed) return;
      if (e.pointerId !== activePointerId) return;

      clearLong();
      sendCommand({ type: 'key', name: keyName, action: longFired ? 'long_release' : 'release' });

      pressed = false;
      try { btn.releasePointerCapture(activePointerId); } catch (_) {}
      activePointerId = null;
    };

    btn.addEventListener('pointerdown', press, { passive: true });
    btn.addEventListener('pointerup', release, { passive: true });
  }

  document.querySelectorAll('[data-key]').forEach((el) => {
    const keyName = (el.getAttribute('data-key') || '').toUpperCase();
    attachKeyBehavior(el, keyName);
  });

  document.querySelectorAll('[data-knob]').forEach((el) => {
    el.addEventListener('click', () => {
      const name = (el.getAttribute('data-knob') || '').toUpperCase();
      const delta = parseInt(el.getAttribute('data-delta'), 10);
      if (!name || Number.isNaN(delta)) return;
      sendCommand({ type: 'knob', name, delta });
    });
  });

  document.querySelectorAll('[data-knob-press]').forEach((el) => {
    el.addEventListener('click', () => {
      const name = (el.getAttribute('data-knob-press') || '').toUpperCase();
      if (!name) return;
      sendCommand({ type: 'knob_press', name, action: 'click' });
    });
  });

  // Initial fetch (optional)
  refreshScreen();
</script>
